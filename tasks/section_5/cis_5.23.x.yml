  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_5.25
    - remoteaccess

# Setting this control to run causes warnings with Gather Facts.
# [WARNING]: Error during machine sid retrieval: Exception calling ".ctor" with "2" argument(s): "The Server service is not started.  "
# From testing purposes errors only show up but gather facts still runs.
  block:
    - name: "5.25 | AUDIT | Ensure 'Routing and Remote Access (RemoteAccess)' is set to 'Disabled' | Check to see if RemoteAccess service exists."
      ansible.windows.win_service_info:
        name: RemoteAccess
      register: discovered_5_25_remoteaccess_service_info

    - name: "5.25 | PATCH | Ensure 'Routing and Remote Access (RemoteAccess)' is set to 'Disabled' | Disable RemoteAccess service."
      when: discovered_5_25_remoteaccess_service_info.exists
      ansible.windows.win_service:
        name: RemoteAccess
        start_mode: disabled
        state: stopped

