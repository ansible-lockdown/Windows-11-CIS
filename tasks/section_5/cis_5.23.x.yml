---

- name: "5.23 | PATCH | Ensure 'Remote Procedure Call (RPC) Locator (RpcLocator)' is set to 'Disabled'."
  when: win11cis_rule_5_23
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_5.23
    - rpclocator
  block:
    - name: "5.23 | AUDIT | Ensure 'Remote Procedure Call (RPC) Locator (RpcLocator)' is set to 'Disabled' | Check to see if RpcLocator service exists."
      ansible.windows.win_service_info:
        name: RpcLocator
      register: discovered_5_23_rpclocator_service_info

    - name: "5.23 | PATCH | Ensure 'Remote Procedure Call (RPC) Locator (RpcLocator)' is set to 'Disabled' | Disable RpcLocator service."
      when: discovered_5_23_rpclocator_service_info.exists
      ansible.windows.win_service:
        name: RpcLocator
        start_mode: disabled
        state: stopped

