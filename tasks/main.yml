---

- name: "Main | Display Banner"
  tags: always
  ansible.builtin.debug:
    msg: "{{ lockdown_banner.split('\n') }}"

- name: "Main | Gather distribution info"
  when: ansible_facts['distribution'] is not defined
  tags: always
  ansible.builtin.setup:
    gather_subset: distribution,!all,!min

- name: "Main | Check OS Version & Family"
  tags: always
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Windows'
      - ansible_facts['distribution'] is regex('Microsoft Windows 11')
    success_msg: "{{ ansible_facts['distribution'] }} Distribution {{ ansible_facts['distribution_major_version'] }} is the detected operating system."
    fail_msg: "This role can only be run against Microsoft Windows 11. {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }} is not supported."

- name: "Main | Check Ansible Version"
  tags: always
  ansible.builtin.assert:
    that: ansible_version.full is version_compare(win11cis_min_ansible_version, '>=')
    msg: You must use Ansible {{ win11cis_min_ansible_version }} or greater.

- name: "Main | Include The Preliminary Tasks"
  tags:
    - always
    - prelim_tasks
  ansible.builtin.import_tasks:
    file: prelim.yml

- name: "Main | Include Section 1 Patches"
  when: win11cis_section1
  tags: section1
  ansible.builtin.import_tasks:
    file: section_1/main.yml

- name: "Main | Include Section 2 Patches"
  when: win11cis_section2
  tags: section2
  ansible.builtin.import_tasks:
    file: section_2/main.yml

- name: "Main | Include Section 5 Patches"
  when: win11cis_section5
  tags: section5
  ansible.builtin.import_tasks:
    file: section_5/main.yml

- name: "Main | Include Section 9 Patches"
  when: win11cis_section9
  tags: section9
  ansible.builtin.import_tasks:
    file: section_9/main.yml

- name: "Main | Include Section 17 Patches"
  when: win11cis_section17
  tags: section17
  ansible.builtin.import_tasks:
    file: section_17/main.yml

- name: "Main | Include Section 18 Patches"
  when: win11cis_section18
  tags: section18
  ansible.builtin.import_tasks:
    file: section_18/main.yml

- name: "Main | Include Section 19 Patches"
  when:
    - win11cis_section19
    - not ansible_check_mode
  tags: section19
  ansible.builtin.import_tasks:
    file: section_19/main.yml

- name: "Main | Run Post Tasks"
  tags: always
  ansible.builtin.import_tasks:
    file: post.yml

- name: "Main | Run post remediation audit"
  when:
    - run_audit
    - not ansible_check_mode
  tags: run_audit
  ansible.builtin.import_tasks:
    file: post_remediation_audit.yml

- name: "Main | Record the benchmark and levels applied"
  when:
    - create_benchmark_facts
    - run_audit
  tags:
    - always
    - benchmark
  block:
    - name: "Main | Create the ansible facts directory"
      ansible.windows.win_file:
        path: "{{ win11cis_ansible_facts_path }}"
        state: directory

    # JSON, not the INI the Linux roles write - ansible.windows.setup reads
    # local facts only as .ps1 or .json, so an INI file would never be read.
    - name: "Main | Create the compliance facts file"
      ansible.windows.win_template:
        src: compliance_facts.json.j2
        dest: '{{ win11cis_ansible_facts_path }}\compliance_facts.json'
        newline_sequence: "\r\n"

- name: "Main | Fetch audit files"
  when:
    - fetch_audit_output
    - run_audit
    - not ansible_check_mode
  tags: always
  ansible.builtin.import_tasks:
    file: fetch_audit_output.yml

- name: "Main | Unload The User Hives Loaded By The Role"
  when:
    - win11cis_section19
    - not ansible_check_mode
    - discovered_hku_preloaded_list is defined
  tags: always
  ansible.builtin.import_tasks:
    file: unload_hives.yml

- name: "Main | Show Audit Summary"
  when:
    - run_audit
    - not ansible_check_mode
  tags: run_audit
  ansible.builtin.debug:
    msg: "{{ audit_results.split('\n') }}"

- name: "Main | If Warnings found Output count and control IDs affected"
  when: warn_count != 0
  tags: always
  ansible.builtin.debug:
    msg:
      - "You have {{ warn_count }} Warning(s) that require investigation(s). Their IDs are listed below:"
      - "{{ warn_control_list }}"
