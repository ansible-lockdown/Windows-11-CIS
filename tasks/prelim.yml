---

- name: "PRELIM | Get Display Version value."
  tags: always
  ansible.windows.win_reg_stat:
    path: HKLM:\Software\Microsoft\Windows NT\CurrentVersion
    name: DisplayVersion
  changed_when: false
  failed_when: false
  register: prelim_displayversion

- name: "PRELIM | Get OS Build value."
  tags: always
  ansible.windows.win_reg_stat:
    path: HKLM:\Software\Microsoft\Windows NT\CurrentVersion
    name: CurrentBuild
  changed_when: false
  failed_when: false
  register: prelim_currentbuild

- name: "PRELIM | Detect if Trusted Platform Module (TPM) is Available"
  tags: always
  ansible.windows.win_shell: (Get-CimInstance -ClassName Win32_OperatingSystem).ProductType
  changed_when: false
  check_mode: false
  failed_when: false
  register: prelim_tpm_enabled

- name: "PRELIM | Check Hyper-V Installation"
  tags: always
  ansible.windows.win_shell: Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All | Select-Object -Property State | ft -hide
  changed_when: false
  check_mode: false
  failed_when: false
  register: prelim_hyper_v_installed

- name: "PRELIM | Check For Windows Defender Application Guard Status"
  tags: always
  ansible.windows.win_shell: Get-WindowsOptionalFeature -Online -FeatureName Windows-Defender-ApplicationGuard | Select-Object -Property State | ft -hide
  changed_when: false
  check_mode: false
  failed_when: false
  register: prelim_wdag_enabled

- name: "PRELIM | Get Windows installation type"
  tags: always
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion
    name: InstallationType
  register: prelim_get_windows_installation_type

- name: "PRELIM | Set Windows installation type"
  tags: always
  ansible.builtin.set_fact:
    discovered_windows_installation_type: "{{ prelim_get_windows_installation_type.value | default('') }}"

- name: "PRELIM | Gather Domain Membership Facts."
  when: ansible_facts['windows_domain_member'] is not defined
  tags: always
  ansible.builtin.setup:
    gather_subset: windows_domain,!all,!min

- name: "PRELIM | Set Fact If Domain Joined."
  when: ansible_facts['windows_domain_member'] is defined
  tags: always
  ansible.builtin.set_fact:
    discovered_domain_joined: "{{ ansible_facts['windows_domain_member'] }}"

- name: "PRELIM | Account Policy Scope"
  tags: always
  block:
    - name: PRELIM | Account Policy Scope | Set fact when account policy is domain scoped
      when: discovered_domain_joined
      ansible.builtin.set_fact:
        discovered_account_policy_is_domain_scoped: true

    - name: PRELIM | Account Policy Scope | Warn that section 1 is set at the domain
      when:
        - win11cis_section1
        - discovered_account_policy_is_domain_scoped
      ansible.builtin.debug:
        msg:
          - "Warning!! This host is domain joined, so Account Policy (CIS section 1) is set by"
          - "the domain, not locally. The Default Domain Policy overwrites local [System Access]"
          - "at every policy refresh, so anything applied here reverts within about two hours"
          - "and an audit run straight afterwards reports a compliance that does not last."
          - "The ten secedit backed controls in section 1 are therefore skipped on this host."
          - "Set them in the Default Domain Policy instead; 1.1.6 is a genuine registry value"
          - "and still applies."

    - name: PRELIM | Account Policy Scope | Set warning count
      vars:
        warn_control_id: 'Section 1 - domain scoped'
      when:
        - win11cis_section1
        - discovered_account_policy_is_domain_scoped
      ansible.builtin.import_tasks:
        file: warning_facts.yml

    - name: PRELIM | Account Policy Scope | Warn that 2.3.11.6 is set at the domain
      when:
        - win11cis_section2
        - win11cis_rule_2_3_11_6
        - discovered_account_policy_is_domain_scoped
      ansible.builtin.debug:
        msg:
          - "Warning!! This host is domain joined. 2.3.11.6 ForceLogoffWhenHourExpire is a"
          - "[System Access] value, and the Default Domain Policy sets it to 0 and overwrites the"
          - "local value at every policy refresh, so a local write reverts and reports changed on"
          - "every run. 2.3.11.6 is therefore skipped on this host. Set it in the Default Domain Policy."

    - name: PRELIM | Account Policy Scope | Set 2.3.11.6 warning count
      vars:
        warn_control_id: '2.3.11.6 - domain scoped'
      when:
        - win11cis_section2
        - win11cis_rule_2_3_11_6
        - discovered_account_policy_is_domain_scoped
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "PRELIM | Obtain And Load Default Hive As Well As User Hives"
  when:
    - win11cis_section19
    - not ansible_check_mode
  tags: always
  block:
    - name: PRELIM | Record The Hives Loaded Before Any Are Loaded By The Role
      ansible.windows.win_shell: (Get-ChildItem "REGISTRY::HKEY_USERS").name | Where-Object {$_ -notlike "*_classes"}
      changed_when: false
      failed_when: false
      register: prelim_hku_baseline

    - name: PRELIM | Create List Fact For The Hives Already Loaded
      ansible.builtin.set_fact:
        discovered_hku_preloaded_list: "{{ prelim_hku_baseline.stdout | regex_replace('HKEY_USERS\\\\', '') | split }}"

    - name: PRELIM | Load Default User Hive (Account That All New Users Get Created From Profile)
      ansible.windows.win_shell: REG LOAD HKU\DEFAULT C:\Users\Default\NTUSER.DAT
      changed_when: false
      failed_when: false

    - name: PRELIM | Pull All Username and SIDs
      ansible.windows.win_shell: Get-CimInstance -Class Win32_UserAccount -Filter "SID LIKE 'S-1-5-%'" | ForEach-Object { $_.Name + " " + $_.SID }
      changed_when: false
      failed_when: false
      register: prelim_all_users

    - name: PRELIM | Create Results List Fact For Username And SIDs
      ansible.builtin.set_fact:
        username_and_sid_results_list: "{{ prelim_all_users.stdout_lines | map('split', ' ') | list }}"

    - name: PRELIM | Load All User Hives From Username And SIDs List
      ansible.windows.win_shell: REG LOAD HKU\{{ item.1 }} C:\Users\{{ item.0 }}\NTUSER.DAT
      changed_when: false
      failed_when: false
      loop: "{{ username_and_sid_results_list }}"

    - name: PRELIM | Retrieve Current Users SIDs from HKEY_USERS
      ansible.windows.win_shell: (Get-ChildItem "REGISTRY::HKEY_USERS").name | Where-Object {$_ -notlike "*_classes"}
      changed_when: false
      failed_when: false
      register: prelim_current_users_loaded_hku

    - name: PRELIM | Create List Fact For Current Users SIDs from HKEY_USERS.
      ansible.builtin.set_fact:
        discovered_hku_loaded_list: "{{ prelim_current_users_loaded_hku.stdout | regex_replace('HKEY_USERS\\\\', '') | split }}"

# Windows enforces LockoutDuration >= ResetLockoutCount, and win_security_policy re-imports the
# whole secedit ini on every call, so each of 1.2.1 and 1.2.4 is validated against the machine's
# current pair. Whichever of the two is written first fails with "The parameter is incorrect" if
# the existing state conflicts - see https://github.com/ansible/ansible/issues/62594.
# Windows always maintains duration >= reset, so lowering ResetLockoutCount to its target first
# (only when the current value would block 1.2.1) makes the fixed order 1.2.2, 1.2.1, 1.2.4, 1.2.3
# valid from any starting state. This replaces the previous cloud-vs-local task-ordering split.
- name: "PRELIM | Account Lockout Policy Ordering"
  when:
    - win11cis_section1
    - not win_skip_for_test
    - not discovered_account_policy_is_domain_scoped
  tags: always
  block:
    - name: PRELIM | Account Lockout Policy Ordering | Read current lockout policy
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $cfg = [System.IO.Path]::GetTempFileName()
        secedit /export /areas SECURITYPOLICY /cfg $cfg /quiet | Out-Null
        $content = Get-Content -LiteralPath $cfg
        Remove-Item -LiteralPath $cfg -Force
        $durationMatch = $content | Select-String '^LockoutDuration\s*=\s*(\d+)'
        $resetMatch = $content | Select-String '^ResetLockoutCount\s*=\s*(\d+)'
        $duration = if ($durationMatch) { $durationMatch.Matches.Groups[1].Value } else { 0 }
        $reset = if ($resetMatch) { $resetMatch.Matches.Groups[1].Value } else { 0 }
        "$duration $reset"
      changed_when: false
      check_mode: false
      register: prelim_lockout_policy

    - name: PRELIM | Account Lockout Policy Ordering | Set current lockout facts
      ansible.builtin.set_fact:
        prelim_win11cis_current_lockout_duration: "{{ prelim_lockout_policy.stdout.split()[0] | int }}"
        prelim_win11cis_current_lockout_reset: "{{ prelim_lockout_policy.stdout.split()[1] | int }}"

    # Only fires when the existing ResetLockoutCount exceeds the target LockoutDuration, which is
    # the one state in which writing 1.2.1 first is rejected. Safe because Windows guarantees the
    # current duration is at least the current reset, so it already exceeds the target reset.
    - name: PRELIM | Account Lockout Policy Ordering | Lower reset counter so 1.2.1 can be applied
      when:
        - win11cis_rule_1_2_1
        - prelim_win11cis_current_lockout_reset | int > win11cis_account_lockout_duration | int
        - win11cis_account_lockout_counter_reset | int <= prelim_win11cis_current_lockout_duration | int
      community.windows.win_security_policy:
        section: System Access
        key: ResetLockoutCount
        value: "{{ win11cis_account_lockout_counter_reset }}"

- name: "PRELIM | Detect Whether The Control Connection Is SSH."
  tags: always
  ansible.builtin.set_fact:
    discovered_control_connection_is_ssh: "{{ (ansible_connection | default('ssh')) in ['ssh', 'smart'] }}"

- name: "PRELIM | Warn That SSH-Breaking Controls Will Be Skipped."
  when: discovered_control_connection_is_ssh
  tags: always
  ansible.builtin.debug:
    msg:
      - "This host is managed over SSH. Control 5.12 (disable/uninstall the OpenSSH SSH Server)"
      - "is skipped automatically, because applying it severs the control connection."
      - "Set ansible_connection explicitly to winrm or psrp to have 5.12 applied."

- name: "PRELIM | Count The SSH-Breaking Controls Warning."
  when: discovered_control_connection_is_ssh
  tags: always
  vars:
    warn_control_id: '5.12'
  ansible.builtin.import_tasks:
    file: warning_facts.yml

- name: "PRELIM | Include pre-remediation audit tasks"
  when:
    - run_audit or audit_only or setup_audit
    - not ansible_check_mode
  tags:
    - run_audit
    - audit_only
    - setup_audit
  ansible.builtin.import_tasks:
    file: pre_remediation_audit.yml
