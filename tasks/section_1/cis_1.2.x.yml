---

# Order is fixed: 1.2.2 sets the threshold, then 1.2.1 the duration, then 1.2.4 the reset counter,
# which Windows requires to be no greater than the duration. Applying 1.2.2 is what enables lockout,
# and Windows then auto-populates duration and reset to 30, so the reconcile step below re-reads the
# pair after 1.2.2 and lowers the reset counter only when it would block 1.2.1.
- name: "1.2.2 | PATCH | Ensure Account lockout threshold is set to 5 or fewer invalid logon attempt(s), but not 0"
  when:
    - win11cis_rule_1_2_2
    - not win_skip_for_test
    - not discovered_account_policy_is_domain_scoped
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_1.2.2
    - NIST800-171_3.1.18
    - NIST800-171_3.1.8
    - NIST800-53R5_AC-19
    - NIST800-53R5_AC-7
  block:
    - name: "1.2.2 | PATCH | Ensure Account lockout threshold is set to 5 or fewer invalid logon attempt(s), but not 0 | Set Variable"
      when:
        - win11cis_bad_login_lockout_count <= 5
        - win11cis_bad_login_lockout_count > 0
      community.windows.win_security_policy:
        section: System Access
        key: LockoutBadCount
        value: "{{ win11cis_bad_login_lockout_count }}"

    - name: "1.2.2 | AUDIT | Ensure Account lockout threshold is set to 5 or fewer invalid logon attempt(s), but not 0 | Verify Variable Not 0 or more than 5 warning"
      when: win11cis_bad_login_lockout_count > 5 or win11cis_bad_login_lockout_count == 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid number of attempts set for win11cis_bad_login_lockout_count. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "1.2.2 | AUDIT | Ensure Account lockout threshold is set to 5 or fewer invalid logon attempt(s), but not 0 | Set warning count"
      when: win11cis_bad_login_lockout_count > 5 or win11cis_bad_login_lockout_count == 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.2.2'

- name: "1.2.1 | PATCH | Ensure Account lockout duration is set to 15 or more minutes | Reconcile the reset counter"
  when:
    - win11cis_rule_1_2_1
    - not win_skip_for_test
    - not discovered_account_policy_is_domain_scoped
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_1.2.1
    - NIST800-171_3.1.18
    - NIST800-171_3.1.8
    - NIST800-53R5_AC-19
    - NIST800-53R5_AC-7
  block:
    - name: "1.2.1 | AUDIT | Ensure Account lockout duration is set to 15 or more minutes | Read the lockout policy as 1.2.2 left it"
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        # Cmdlets, operators and $Matches only - no .NET method calls - so this still
        # runs where PowerShell is in Constrained Language Mode. secedit must write to
        # a path that does not already exist or the export drops its [Unicode] header.
        $cfg = Join-Path $env:TEMP "cis_lockout_$PID.inf"
        Remove-Item -LiteralPath $cfg -Force -ErrorAction SilentlyContinue
        secedit /export /areas SECURITYPOLICY /cfg $cfg /quiet | Out-Null
        $content = Get-Content -LiteralPath $cfg
        Remove-Item -LiteralPath $cfg -Force -ErrorAction SilentlyContinue
        $duration = 0
        $reset = 0
        foreach ($line in $content) {
          if ($line -match '^LockoutDuration\s*=\s*(\d+)') { $duration = $Matches[1] }
          if ($line -match '^ResetLockoutCount\s*=\s*(\d+)') { $reset = $Matches[1] }
        }
        "$duration $reset"
      changed_when: false
      check_mode: false
      register: discovered_lockout_policy

    - name: "1.2.1 | AUDIT | Ensure Account lockout duration is set to 15 or more minutes | Set the current lockout facts"
      ansible.builtin.set_fact:
        discovered_win11cis_current_lockout_duration: "{{ discovered_lockout_policy.stdout.split()[0] | int }}"
        discovered_win11cis_current_lockout_reset: "{{ discovered_lockout_policy.stdout.split()[1] | int }}"

    - name: "1.2.1 | PATCH | Ensure Account lockout duration is set to 15 or more minutes | Lower the reset counter so the duration can be applied"
      when:
        - discovered_win11cis_current_lockout_reset | int > win11cis_account_lockout_duration | int
        - win11cis_account_lockout_counter_reset | int <= discovered_win11cis_current_lockout_duration | int
      community.windows.win_security_policy:
        section: System Access
        key: ResetLockoutCount
        value: "{{ win11cis_account_lockout_counter_reset }}"

    - name: "1.2.1 | PATCH | Ensure Account lockout duration is set to 15 or more minutes | Set Variable"
      when: win11cis_account_lockout_duration >= 15
      community.windows.win_security_policy:
        section: System Access
        key: LockoutDuration
        value: "{{ win11cis_account_lockout_duration }}"

    - name: "1.2.1 | AUDIT | Ensure Account lockout duration is set to 15 or more minutes | Verify variable set to 15 or more minutes warning"
      when: win11cis_account_lockout_duration < 15
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid number of minutes set for win11cis_account_lockout_duration please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "1.2.1 | AUDIT | Ensure Account lockout duration is set to 15 or more minutes | Set warning count"
      when: win11cis_account_lockout_duration < 15
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.2.1'

- name: "1.2.4 | PATCH | Ensure Reset account lockout counter after is set to 15 or more minutes"
  when:
    - win11cis_rule_1_2_4
    - not win_skip_for_test
    - not discovered_account_policy_is_domain_scoped
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_1.2.4
    - NIST800-171_3.1.18
    - NIST800-171_3.1.8
    - NIST800-53R5_AC-19
    - NIST800-53R5_AC-7

  block:
    - name: "1.2.4 | PATCH | Ensure Reset account lockout counter after is set to 15 or more minutes | Set Variable"
      when:
        - win11cis_account_lockout_counter_reset >= 15
        - win11cis_account_lockout_counter_reset <= win11cis_account_lockout_duration
      community.windows.win_security_policy:
        section: System Access
        key: ResetLockoutCount
        value: "{{ win11cis_account_lockout_counter_reset }}"

    - name: "1.2.4 | AUDIT | Ensure Reset account lockout counter after is set to 15 or more minutes | Verify variable set to 15 or more minutes warning"
      when: win11cis_account_lockout_counter_reset > win11cis_account_lockout_duration or win11cis_account_lockout_counter_reset < 15
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid number of minutes set for win11cis_account_lockout_counter_reset. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "1.2.4 | AUDIT | Ensure Reset account lockout counter after is set to 15 or more minutes | Set warning count"
      when: win11cis_account_lockout_counter_reset > win11cis_account_lockout_duration or win11cis_account_lockout_counter_reset < 15
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.2.4'

- name: "1.2.3 | PATCH | Ensure Allow Administrator account lockout is set to Enabled"
  when:
    - win11cis_rule_1_2_3
    - not win_skip_for_test
    - not discovered_account_policy_is_domain_scoped
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - manual
    - rule_1.2.3
    - account_policies
    - NIST800-171_3.1.18
    - NIST800-171_3.1.8
    - NIST800-53R5_AC-19
    - NIST800-53R5_AC-7
  community.windows.win_security_policy:
    section: System Access
    key: AllowAdministratorLockout
    value: 1
