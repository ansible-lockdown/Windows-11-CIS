---

- name: "9.2.1 | PATCH | Ensure 'Windows Firewall: Private: Firewall state' is set to 'On (recommended)'"
  when: win11cis_rule_9_2_1
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_9.2.1
    - firewall_state
    - NIST800-171_3.13.1
    - NIST800-171_3.13.5
    - NIST800-171_3.13.6
    - NIST800-53R5_SC-7
    - NIST800-53R5_SC-7_5
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile
    name: EnableFirewall
    data: 1
    type: dword

- name: "9.2.2 | PATCH | Ensure 'Windows Firewall: Private: Inbound connections' is set to 'Block (default)'"
  when: win11cis_rule_9_2_2
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_9.2.2
    - inbound_connections
    - NIST800-171_3.13.1
    - NIST800-171_3.13.5
    - NIST800-171_3.13.6
    - NIST800-53R5_SC-7
    - NIST800-53R5_SC-7_5
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile
    name: DefaultInboundAction
    data: 1
    type: dword

- name: "9.2.3 | PATCH | Ensure 'Windows Firewall: Private: Settings: Display a notification' is set to 'No'"
  when: win11cis_rule_9_2_3
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_9.2.3
    - notifications
    - NIST800-171_3.13.1
    - NIST800-171_3.13.5
    - NIST800-171_3.13.6
    - NIST800-53R5_SC-7
    - NIST800-53R5_SC-7_5
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile
    name: DisableNotifications
    data: 1
    type: dword

# title has slashes switched
- name: "9.2.4 | PATCH | Ensure 'Windows Firewall: Private: Logging: Name' is set to '%SystemRoot%/System32/logfiles/firewall/privatefw.log'"
  when: win11cis_rule_9_2_4
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_9.2.4
    - logging_name
    - NIST800-171_3.13.1
    - NIST800-171_3.13.5
    - NIST800-171_3.13.6
    - NIST800-53R5_SC-7
    - NIST800-53R5_SC-7_5
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging
    name: LogFilePath
    data: '{{ win11cis_private_firewall_log_path }}'
    type: string

- name: "9.2.5 | PATCH | Ensure 'Windows Firewall: Private: Logging: Size limit (KB)' is set to '16,384 KB or greater'"
  when: win11cis_rule_9_2_5
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_9.2.5
    - logging_size
    - NIST800-171_3.13.1
    - NIST800-171_3.13.5
    - NIST800-171_3.13.6
    - NIST800-53R5_SC-7
    - NIST800-53R5_SC-7_5
  block:
    - name: "9.2.5 | PATCH | Ensure 'Windows Firewall: Private: Logging: Size limit (KB)' is set to '16,384 KB or greater' | Apply Settings To Registry"
      when: win11cis_private_firewall_log_size >= 16384
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging
        name: LogFileSize
        data: '{{ win11cis_private_firewall_log_size }}'
        type: dword

    - name: "9.2.5 | AUDIT | Ensure 'Windows Firewall: Private: Logging: Size limit (KB)' is set to '16,384 KB or greater' | Warning Check For Variable Standards"
      when: win11cis_private_firewall_log_size < 16384
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an invalid size set for win11cis_private_firewall_log_size. Please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "9.2.5 | AUDIT | Ensure 'Windows Firewall: Private: Logging: Size limit (KB)' is set to '16,384 KB or greater' | Warn Count"
      when: win11cis_private_firewall_log_size < 16384
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '9.2.5'

- name: "9.2.6 | PATCH | Ensure 'Windows Firewall: Private: Logging: Log dropped packets' is set to 'Yes'"
  when: win11cis_rule_9_2_6
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_9.2.6
    - logging_packets
    - NIST800-171_3.13.1
    - NIST800-171_3.13.5
    - NIST800-171_3.13.6
    - NIST800-171_3.3.1
    - NIST800-171_3.3.2
    - NIST800-171_3.3.6
    - NIST800-53R5_AU-12
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-3_1
    - NIST800-53R5_AU-7
    - NIST800-53R5_SC-7
    - NIST800-53R5_SC-7_5
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging
    name: LogDroppedPackets
    data: 1
    type: dword

- name: "9.2.7 | PATCH | Ensure 'Windows Firewall: Private: Logging: Log successful connections' is set to 'Yes'"
  when: win11cis_rule_9_2_7
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_9.2.7
    - logging_connections
    - NIST800-171_3.13.1
    - NIST800-171_3.13.5
    - NIST800-171_3.13.6
    - NIST800-171_3.3.1
    - NIST800-171_3.3.2
    - NIST800-171_3.3.6
    - NIST800-53R5_AU-12
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-3_1
    - NIST800-53R5_AU-7
    - NIST800-53R5_SC-7
    - NIST800-53R5_SC-7_5
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging
    name: LogSuccessfulConnections
    data: 1
    type: dword
