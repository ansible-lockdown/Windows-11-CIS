- name: "2.2.24 | PATCH | Ensure Impersonate a client after authentication is set to Administrators, LOCAL SERVICE, NETWORK SERVICE, SERVICE."
  when: win11cis_rule_2_2_24
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_2.2.24
    - administrators
  block:
    - name: "2.2.24 | AUDIT | Ensure Impersonate a client after authentication is set to Administrators, LOCAL SERVICE, NETWORK SERVICE, SERVICE. | Check IIS-WebServerRole"
      ansible.windows.win_shell: Get-WindowsOptionalFeature -Online -FeatureName IIS-WebServerRole | Select-Object -Property State | ft -hide
      changed_when: false
      check_mode: false
      failed_when: false
      register: discovered_2_2_24_iis_web_server_role_installed

    - name: "2.2.24 | PATCH | Ensure Impersonate a client after authentication is set to Administrators, LOCAL SERVICE, NETWORK SERVICE, SERVICE. | Web Server Not Installed."
      when: "'Enabled' not in discovered_2_2_24_iis_web_server_role_installed.stdout_lines"
      ansible.windows.win_user_right:
        name: SeImpersonatePrivilege
        users:
          - Administrators
          - Local Service
          - Network Service
          - Service
        action: set

    - name: "2.2.24 | PATCH | Ensure Impersonate a client after authentication is set to Administrators, LOCAL SERVICE, NETWORK SERVICE, SERVICE. | Web Server Installed."
      when: "'Enabled' in discovered_2_2_24_iis_web_server_role_installed.stdout_lines"
      ansible.windows.win_user_right:
        name: SeImpersonatePrivilege
        users:
          - Administrators
          - IIS_IUSRS
          - Local Service
          - Network Service
          - Service
        action: set

