- name: "2.2.29 | PATCH | Configure Log on as a service."
  when: win11cis_rule_2_2_29
  tags:
    - level2-high-security-sensitive-data-environment
    - patch
    - automated
    - rule_2.2.29
  block:
    - name: "2.2.29 | PATCH | Configure Log on as a service. | Hyper-V not installed."
      when:
        - "'Enabled' not in prelim_hyper_v_installed.stdout"
        - win11cis_seservicelogonright | length == 0
      ansible.windows.win_user_right:
        name: SeServiceLogonRight
        users: "{{ win11cis_seservicelogonright }}"
        action: set

    - name: "2.2.29 | PATCH | Configure Log on as a service. | Hyper-V installed."
      when:
        - "'Enabled' in prelim_hyper_v_installed.stdout"
        - win11cis_seservicelogonright | length == 0
      ansible.windows.win_user_right:
        name: SeServiceLogonRight
        users:
          - NT VIRTUAL MACHINE\Virtual Machines
        action: set

    - name: "2.2.29 | PATCH | Configure Log on as a service. | WDAG Enabled ."
      when:
        - "'Enabled' in prelim_wdag_enabled.stdout"
        - win11cis_seservicelogonright | length == 0
      ansible.windows.win_user_right:
        name: SeServiceLogonRight
        users:
          - WDAGUtilityAccount
        action: set

    - name: "2.2.29 | PATCH | Configure Log on as a service. | Hyper-V & WDAG Enabled ."
      when:
        - "'Enabled' in prelim_wdag_enabled.stdout"
        - "'Enabled' in prelim_hyper_v_installed.stdout"
        - win11cis_seservicelogonright | length == 0
      ansible.windows.win_user_right:
        name: SeServiceLogonRight
        users:
          - NT VIRTUAL MACHINE\Virtual Machines
          - WDAGUtilityAccount
        action: set

    - name: "2.2.29 | PATCH | Configure Log on as a service. | User Defined Input."
      when: win11cis_seservicelogonright | length > 0
      ansible.windows.win_user_right:
        name: SeServiceLogonRight
        users: "{{ win11cis_seservicelogonright }}"
        action: set

