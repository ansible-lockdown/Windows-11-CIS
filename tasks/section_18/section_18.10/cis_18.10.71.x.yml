---

- name: "18.10.71.1 | PATCH | Ensure 'Allow widgets' is set to 'Disabled'"
  when: win11cis_rule_18_10_71_1
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.10.71.1
  block:
    - name: "18.10.71.1 | PATCH | Ensure 'Allow widgets' is set to 'Disabled'. | Set Value."
      ansible.windows.win_regedit:
        path: HKLM:\Software\Policies\Microsoft\Dsh
        name: AllowNewsAndInterests
        data: 0
        type: dword
      failed_when:
        - discovered_18_10_71_1_write is failed
        - "'Attempted to perform an unauthorized operation' not in discovered_18_10_71_1_write.msg | default('')"
      register: discovered_18_10_71_1_write

    - name: "18.10.71.1 | AUDIT | Ensure 'Allow widgets' is set to 'Disabled'. | Warning The Operating System Blocked The Write."
      when: "'Attempted to perform an unauthorized operation' in discovered_18_10_71_1_write.msg | default('')"
      ansible.builtin.debug:
        msg:
          - "Warning!! The User Choice Protection Driver (UCPD) refused the write to AllowNewsAndInterests,"
          - "so widgets have not been disabled by this role. UCPD protects this value from every process"
          - "outside its own allow list, elevated or not, so it can only be set through Group Policy."
          - "Apply it from a GPO or accept the control as not applicable."

    - name: "18.10.71.1 | AUDIT | Ensure 'Allow widgets' is set to 'Disabled'. | Warn Count."
      when: "'Attempted to perform an unauthorized operation' in discovered_18_10_71_1_write.msg | default('')"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '18.10.71.1'
