---

- name: "18.10.55.1 | PATCH | Ensure Turn off Push To Install service is set to 'Enabled'"
  when: win11cis_rule_18_10_55_1
  tags:
    - level2-high-security-sensitive-data-environment
    - patch
    - automated
    - rule_18.10.55.1
    - NIST800-171_3.4.8
    - NIST800-53R5_CM-10
    - NIST800-53R5_CM-7_5
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\PushToInstall
    name: DisablePushToInstall
    data: 1
    type: dword
