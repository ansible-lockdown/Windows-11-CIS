---

- name: "18.6.11.2 | PATCH | Ensure Prohibit installation and configuration of Network Bridge on your DNS domain network is set to Enabled"
  when: win11cis_rule_18_6_11_2
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.6.11.2
    - network_bridge
    - NIST800-171_3.1.16
    - NIST800-171_3.1.17
    - NIST800-171_3.4.1
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_AC-18
    - NIST800-53R5_AC-18_1
    - NIST800-53R5_AC-18_3
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_CM-7_1
    - NIST800-53R5_CM-9
    - NIST800-53R5_CM_9
  ansible.windows.win_regedit:
    path: HKLM:\Software\Policies\Microsoft\Windows\Network Connections
    name: NC_AllowNetBridge_NLA
    data: 0
    type: dword

- name: "18.6.11.3 | PATCH | Ensure Prohibit use of Internet Connection Sharing on your DNS domain network is set to Enabled"
  when: win11cis_rule_18_6_11_3
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.6.11.3
    - ics
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections
    name: NC_ShowSharedAccessUI
    data: 0
    type: dword

- name: "18.6.11.4 | PATCH | Ensure Require domain users to elevate when setting a networks location is set to Enabled"
  when: win11cis_rule_18_6_11_4
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.6.11.4
    - domain_users
    - NIST800-171_3.1.7
    - NIST800-53R5_AC-6_10
  ansible.windows.win_regedit:
    path: HKLM:\Software\Policies\Microsoft\Windows\Network Connections
    name: NC_StdDomainUserSetLocation
    data: 1
    type: dword
