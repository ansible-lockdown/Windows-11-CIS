---

- name: "18.6.21.1 | PATCH | Ensure 'Minimize the number of simultaneous connections to the Internet or a Windows Domain' is set to 'Enabled: 3 = Prevent Wi-Fi when on Ethernet'"
  when: win11cis_rule_18_6_21_1
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.6.21.1
    - domain
    - NIST800-171_3.13.1
    - NIST800-171_3.13.2
    - NIST800-171_3.4.1
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_AC-2
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_CM-7_1
    - NIST800-53R5_CM-9
    - NIST800-53R5_SA-10
    - NIST800-53R5_SA-3
    - NIST800-53R5_SA-8
  ansible.windows.win_regedit:
    path: HKLM:\Software\Policies\Microsoft\Windows\Wcmsvc\Grouppolicy
    name: fMinimizeConnections
    data: 3
    type: dword

- name: "18.6.21.2 | PATCH | Ensure 'Prohibit connection to non-domain networks when connected to domain authenticated network' is set to 'Enabled'"
  when:
    - win11cis_rule_18_6_21_2
    - discovered_domain_joined
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.6.21.2
    - non_domain
  ansible.windows.win_regedit:
    path: HKLM:\Software\Policies\Microsoft\Windows\Wcmsvc\Grouppolicy
    name: fBlockNonDomain
    data: 1
    type: dword
