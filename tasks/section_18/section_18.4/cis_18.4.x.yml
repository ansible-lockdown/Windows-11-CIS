---

- name: "18.4.1 | PATCH | Ensure Apply UAC restrictions to local accounts on network logons is set to Enabled"
  when: win11cis_rule_18_4_1
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.4.1
    - uac
  ansible.windows.win_regedit:
    path: HKLM:\Software\Microsoft\Windows\Currentversion\Policies\System
    name: LocalAccountTokenFilterPolicy
    data: 0
    type: dword

- name: "18.4.2 | PATCH | Ensure Configure RPC packet level privacy setting for incoming connections is set to Enabled"
  when: win11cis_rule_18_4_2
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.4.2
    - rpc
    - NIST800-171_3.14.6
    - NIST800-171_3.14.7
    - NIST800-53R5_SI-4
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Print
    name: RpcAuthnLevelPrivacyEnabled
    data: 1
    type: dword

- name: "18.4.3 | PATCH | Ensure Configure SMB v1 client driver is set to Enabled Disable driver recommended"
  when: win11cis_rule_18_4_3
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.4.3
    - smb
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\mrxsmb10
    name: Start
    data: 4
    type: dword

- name: "18.4.4 | PATCH | Ensure Configure SMB v1 server is set to Disabled"
  when: win11cis_rule_18_4_4
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.4.4
    - smb
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: SMB1
    data: 0
    type: dword
  notify: Change_requires_reboot

- name: "18.4.5 | PATCH | Ensure 'Enable Certificate Padding' is set to 'Enabled'"
  when: win11cis_rule_18_4_5
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.4.5
    - certificate_padding
    - NIST800-171_3.4.8
    - NIST800-53R5_SC-8
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Cryptography\Wintrust\Config
    name: EnableCertPaddingCheck
    data: 1
    type: dword

- name: "18.4.6 | PATCH | Ensure Enable Structured Exception Handling Overwrite Protection SEHOP is set to Enabled"
  when: win11cis_rule_18_4_6
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.4.6
    - sehop
    - NIST800-53R5_SI-16
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel
    name: DisableExceptionChainValidation
    data: 0
    type: dword

- name: "18.4.7 | PATCH | Ensure 'NetBT NodeType configuration' is set to 'Enabled: P-node recommended'"
  when: win11cis_rule_18_4_7
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.4.7
    - sehop
    - NIST800-171_3.13.1
    - NIST800-171_3.13.2
    - NIST800-171_3.4.1
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_AC-2
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_CM-7_1
    - NIST800-53R5_CM-9
    - NIST800-53R5_SA-10
    - NIST800-53R5_SA-3
    - NIST800-53R5_SA-8
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters
    value: NodeType
    data: "{{ win11cis_netbt_nodetype }}"
    datatype: dword

- name: "18.4.8 | PATCH | Ensure WDigest Authentication is set to Disabled"
  when:
    - win11cis_rule_18_4_8
    - discovered_domain_joined
  tags:
    - level1-corporate-enterprise-environment
    - patch
    - automated
    - rule_18.4.8
    - wdigest
    - NIST800-171_3.13.6
    - NIST800-171_3.5.2
    - NIST800-53R5_IA-5_1
    - NIST800-53R5_SC-28
    - NIST800-53R5_SC-28_1
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\Wdigest
    value: UseLogonCredential
    data: 0
    datatype: dword
