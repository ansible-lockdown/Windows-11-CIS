---

# vars file for .

# Used to control warning summary
warn_control_list: ""
warn_count: 0

# This sets the variable that is created for the banner.
lockdown_banner: "{{ lookup('file', './templates/banner.txt') }}"

# Default setting, this should not be changed
# and is overridden if a task that changed sets the value if required.
reboot_host: false

# discovered_domain_joined is a setting built into the playbook for some controls that only apply
# to standalone or domain joined systems. prelim.yml overwrites it from the windows_domain facts.
# It defaults to false so that a host whose domain membership could not be established is treated
# as standalone rather than having domain-only settings applied to it.
discovered_domain_joined: false

# Read from secedit in section_1/cis_1.2.x.yml, after 1.2.2 has enabled lockout. Windows
# rejects a LockoutDuration lower than the current ResetLockoutCount, so 1.2.1 needs the pair
# as it stands at that point, not as it stood before the role touched it.
discovered_win11cis_current_lockout_duration: 0
discovered_win11cis_current_lockout_reset: 0

# Account Policy (CIS section 1) is domain scoped on any domain joined host: the
# Default Domain Policy overwrites local [System Access] at every refresh, so the
# ten secedit backed controls in section 1 cannot hold there. Seeded false so a
# standalone host still applies them; prelim sets it true when joined. 1.1.6 is a
# genuine registry value and is not covered by this.
discovered_account_policy_is_domain_scoped: false
